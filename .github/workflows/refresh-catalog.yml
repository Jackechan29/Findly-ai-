name: Refresh authorised product catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync retailer feed
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
        run: node scripts/sync.mjs
      - name: Commit refreshed catalogue when changed
        run: |
          if ! git diff --quiet -- catalog.json; then
            git config user.name "findly-catalog-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.json
            git commit -m "Refresh affiliate product catalogue"
            git push
          fi
